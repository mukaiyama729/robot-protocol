name: Notify robot-system

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send update event to robot-system
        env:
          GH_TOKEN: ${{ secrets.ROBOT_SYSTEM_DISPATCH_TOKEN }}
          TARGET_REPOSITORY: ${{ vars.ROBOT_SYSTEM_REPO }}
          EVENT_TYPE: robot-protocol-updated
          REVISION: ${{ github.sha }}
        run: |
          if [[ -z "$TARGET_REPOSITORY" || -z "$GH_TOKEN" ]]; then
            echo "::notice::Set ROBOT_SYSTEM_REPO and ROBOT_SYSTEM_DISPATCH_TOKEN to enable notifications."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TARGET_REPOSITORY}/dispatches" \
            --data "{\"event_type\":\"${EVENT_TYPE}\",\"client_payload\":{\"sha\":\"${REVISION}\"}}"
